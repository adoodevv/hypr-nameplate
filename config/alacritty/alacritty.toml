# Terminal - Omarchy-style (installed by hypr-nameplate)
[env]
TERM = "xterm-256color"

[window]
padding = { x = 14, y = 14 }
decorations = "None"        # no title bar: move with Super+drag, close with Ctrl+D
opacity = 0.97
dynamic_padding = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 9.0

[cursor]
style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true

# Colours: this block is rewritten by 'theme set NAME'
# theme:begin colors
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.search.matches]
foreground = "#1a1b26"
background = "#e0af68"

[colors.search.focused_match]
foreground = "#1a1b26"
background = "#f7768e"

[colors.selection]
text = "#1a1b26"
background = "#7aa2f7"

[colors.normal]
black = "#24283b"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#c0caf5"
# theme:end
