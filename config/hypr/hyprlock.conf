# Lock screen (hyprlock), like the latest Omarchy's: the theme's solid
# background, your name in block letters in the theme's accent, and a
# padlock beside a small password field under it. Everything recolours
# with the theme (bin/theme rewrites the colours below and the logo).
# Docs: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Colours: this block is rewritten by 'theme set NAME'
# theme:begin colors
$np_bg = rgba(26, 27, 38, 1.0)
$np_field = rgba(26, 27, 38, 0.85)
$np_text = rgba(192, 202, 245, 1.0)
$np_accent = rgba(122, 162, 247, 1.0)
$np_check = rgba(224, 175, 104, 1.0)
$np_fail = rgba(247, 118, 142, 1.0)
# theme:end

# No fade: the lock screen captures the screen as it starts and fades back to that
# capture when you unlock, which showed the screensaver again for a moment.
animations {
    enabled = false
}

# The theme's background colour, flat (Omarchy's lock sits on this, no picture)
background {
    monitor =
    color = $np_bg
}

# Your name in block letters, centred. bin/theme recolours logo.png in the
# theme's accent on every theme switch, like Omarchy's per-theme unlock logo.
# (hyprlock positions: positive y is up from the centre, negative is down.)
image {
    monitor =
    path = @HOME@/.config/nameplate/logo.png
    size = 95
    rounding = 0
    border_size = 0
    position = 0, 72
    halign = center
    valign = center
}

# The padlock, just left of the password field: Omarchy's Font Awesome lock
# (U+F023), rendered to lock-icon.png by bin/theme in the theme's foreground,
# because hyprlock's label renderer clipped the glyph's right side.
image {
    monitor =
    path = @HOME@/.config/nameplate/lock-icon.png
    size = 30
    rounding = 0
    border_size = 0
    position = -145, -42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 38
    position = 0, -42
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 0
    outer_color = $np_text
    inner_color = $np_field
    font_color = $np_text
    font_family = JetBrainsMono Nerd Font
    font_size = 13
    check_color = $np_check
    fail_color = $np_fail

    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = $FAIL ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.3
}
