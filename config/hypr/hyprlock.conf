# Lock screen (hyprlock)
# Docs: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

# Blurred snapshot of whatever was on screen; falls back to the solid colour
background {
    monitor =
    path = screenshot
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

@LOCK_BRAND@

input-field {
    monitor =
    size = 420, 56
    position = 0, -8%
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 0
    outer_color = rgba(122, 162, 247, 1.0)
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgba(192, 202, 245, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(224, 175, 104, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)

    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = $FAIL ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.3
}
