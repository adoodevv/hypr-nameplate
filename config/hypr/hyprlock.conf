# Lock screen (hyprlock), like the latest Omarchy's: the wallpaper blurred
# behind a single password field in the middle of the screen. The field
# recolours with the theme (bin/theme rewrites the colours below).
# Docs: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Colours: this block is rewritten by 'theme set NAME'
# theme:begin colors
$np_bg = rgba(26, 27, 38, 1.0)
$np_field = rgba(26, 27, 38, 0.80)
$np_text = rgba(192, 202, 245, 1.0)
$np_accent = rgba(122, 162, 247, 1.0)
$np_check = rgba(224, 175, 104, 1.0)
$np_fail = rgba(247, 118, 142, 1.0)
# theme:end

# No fade: the lock screen captures the screen as it starts and fades back to that
# capture when you unlock, which showed the screensaver again for a moment.
animations {
    enabled = false
}

# The wallpaper, blurred by hyprlock itself. bin/wallpaper keeps lock.png in
# step with the picker; the colour is only a fallback if that file is missing.
background {
    monitor =
    path = @HOME@/.config/nameplate/lock.png
    color = $np_bg
    blur_passes = 3
}

input-field {
    monitor =
    size = 381, 67
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 3
    rounding = 0
    outer_color = $np_accent
    inner_color = $np_field
    font_color = $np_text
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    check_color = $np_check
    fail_color = $np_fail

    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = $FAIL ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.3
}
