# Idle behaviour (hypridle)
# 2.5 min: screensaver   5 min: lock   5.5 min: screen off   30 min: suspend

general {
    lock_cmd = @HOME@/.config/nameplate/bin/stop-screensaver; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150
    on-timeout = pidof hyprlock || @HOME@/.config/nameplate/bin/launch-screensaver
    on-resume = @HOME@/.config/nameplate/bin/stop-screensaver
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
