# Idle behaviour (hypridle), the Omarchy 3 way
# 2.5 min: screensaver    5 min: lock (started by the screensaver itself)
# 5.5 min: display off    30 min: suspend
# The 300 s lock below is a backup in case the screensaver could not start.
# On the lock screen the display also goes off after 10 s without a key press, so
# locking by hand darkens the screen soon after, but typing keeps it on.

general {
    lock_cmd = @HOME@/.config/nameplate/bin/lock
    # Lock before sleeping, and hold the sleep
    # until the lock screen is really up, so the laptop never sleeps unlocked
    before_sleep_cmd = @HOME@/.config/nameplate/bin/lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 150
    on-timeout = pidof hyprlock || @HOME@/.config/nameplate/bin/launch-screensaver
    on-resume = @HOME@/.config/nameplate/bin/screensaver-resume
}

listener {
    timeout = 10
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
