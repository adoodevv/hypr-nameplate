# App launcher (fuzzel). Colours: the theme block, rewritten by 'theme set NAME'
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="  "
width=40
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=24
icons-enabled=yes
icon-theme=@ICON_THEME@
terminal=alacritty -e
layer=overlay

[colors]
# theme:begin colors
background=1a1b26ee
text=a9b1d6ff
prompt=7aa2f7ff
input=c0caf5ff
match=7aa2f7ff
selection=292e42ff
selection-text=c0caf5ff
selection-match=0db9d7ff
border=7aa2f7ff
# theme:end

[border]
width=2
radius=0
